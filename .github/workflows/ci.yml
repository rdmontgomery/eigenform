name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  webterm:
    name: webterm (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webterm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webterm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: rust (fmt · clippy · test · embedded build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked
      # The `just install` path: bake webterm/dist into the binary and prove the
      # daemon serves it with no on-disk frontend.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webterm/package-lock.json
      - name: build webterm for embedding
        working-directory: webterm
        run: npm ci && npm run build
      - name: embedded-assets test
        run: cargo test -p eigenform-daemon --features embed-assets --test embedded --locked
