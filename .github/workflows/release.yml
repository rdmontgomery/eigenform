name: Release

# Every green CI run on main cuts a release: v0.1.<commit count>, prebuilt binaries for
# macOS (arm + intel) and Linux x86_64, then the Homebrew formula in
# rdmontgomery/homebrew-eigenform is regenerated so `brew upgrade eigenform` picks it up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        run: |
          sha=$(git rev-parse HEAD)
          version="0.1.$(git rev-list --count HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already released — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webterm/package-lock.json
      - name: build webterm for embedding
        working-directory: webterm
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build eigenform
        env:
          EIGENFORM_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --locked -p eigenform-cli --features embed-assets --target ${{ matrix.target }}
      - name: package
        run: |
          name="eigenform-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$name" eigenform
          shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: eigenform-${{ matrix.target }}
          path: eigenform-${{ matrix.target }}.tar.gz*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.sha256 \
            --target "$SHA" --title "v$VERSION" --generate-notes
      - name: render formula
        run: packaging/homebrew/render-formula.sh "${{ needs.version.outputs.version }}" dist > eigenform.rb
      # Needs a fine-grained token with contents:write on rdmontgomery/homebrew-eigenform,
      # stored as the HOMEBREW_TAP_TOKEN secret. Without it the release still ships;
      # only the tap update is skipped.
      - name: update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping tap update"
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/rdmontgomery/homebrew-eigenform.git" tap
          mkdir -p tap/Formula
          cp eigenform.rb tap/Formula/eigenform.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/eigenform.rb
          git commit -m "eigenform $VERSION"
          git push
